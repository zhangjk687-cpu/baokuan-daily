<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:," />
    <title>凯哥社媒工作室每日全球爆款</title>
<style>
      :root{
        --navy:#081F5C;
        --navy-deep:#05163F;
        --gold:#C9A961;
        --gold-soft:#E7D9B4;
        --bg:#F5F5F5;
        --card:#FFFFFF;
        --ink:#1A1E28;
        --ink-2:#4A5060;
        --ink-3:#7A8090;
        --line:#E4E2DA;
        --serif:"Noto Serif SC","Songti SC","STSong",serif;
        --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
      }
      *{box-sizing:border-box;}
      html,body{margin:0;padding:0;}
      body{
        background:var(--bg);
        color:var(--ink);
        font-family:var(--sans);
        font-size:16px;
        line-height:1.65;
        -webkit-font-smoothing:antialiased;
      }
      img{max-width:100%;display:block;}
      a{-webkit-tap-highlight-color:transparent;}

      /* ---------- Header ---------- */
      .masthead{
        background:linear-gradient(180deg,var(--navy) 0%,var(--navy-deep) 100%);
        color:#fff;
        padding:30px 20px 26px;
      }
      .masthead-inner{max-width:680px;margin:0 auto;}
      .brand-row{
        display:flex;align-items:center;gap:12px;
        font-size:13px;letter-spacing:.28em;color:var(--gold-soft);
        margin-bottom:16px;
      }
      .brand-row::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent);}
      h1{
        font-family:var(--serif);font-weight:900;
        font-size:30px;line-height:1.3;margin:0 0 6px;
        letter-spacing:.02em;
      }
      .masthead .date{
        font-family:var(--serif);font-size:16px;color:var(--gold-soft);
        letter-spacing:.14em;margin:0 0 22px;
      }
      .stats{
        display:grid;grid-template-columns:repeat(5,1fr);
        border-top:1px solid rgba(201,169,97,.45);
        border-bottom:1px solid rgba(201,169,97,.45);
        padding:14px 0 12px;margin-bottom:22px;
      }
      .stat{text-align:center;padding:0 2px;}
      .stat + .stat{border-left:1px solid rgba(255,255,255,.14);}
      .stat b{
        display:block;font-family:var(--serif);font-weight:700;
        font-size:24px;line-height:1.15;color:#fff;
      }
      .stat span{font-size:11.5px;color:#C7CCDC;letter-spacing:.06em;}
      .stat.gold b{color:var(--gold);}
      .download-btn{
        display:flex;align-items:center;justify-content:center;gap:10px;
        width:100%;min-height:52px;
        background:var(--gold);color:var(--navy-deep);
        font-family:var(--sans);font-size:16px;font-weight:700;letter-spacing:.08em;
        text-decoration:none;border-radius:4px;
        box-shadow:0 4px 14px rgba(0,0,0,.28);
      }
      .download-btn:active{transform:translateY(1px);}
      .download-btn svg{flex:none;}

      /* ---------- Filter ---------- */
      .filterbar{
        position:sticky;top:0;z-index:20;
        background:rgba(245,245,245,.96);
        backdrop-filter:blur(6px);
        border-bottom:1px solid var(--line);
        padding:12px 16px 10px;
      }
      .filterbar-inner{max-width:680px;margin:0 auto;}
      .chips{display:flex;flex-wrap:wrap;gap:8px;}
      .chip{
        min-height:40px;padding:8px 14px;
        border:1px solid #C9CBD4;border-radius:999px;
        background:#fff;color:var(--ink-2);
        font-family:var(--sans);font-size:14.5px;font-weight:500;
        cursor:pointer;
      }
      .chip .n{font-family:var(--serif);font-weight:700;margin-left:3px;}
      .chip.active{
        background:var(--navy);border-color:var(--navy);color:#fff;
      }
      .chip.active .n{color:var(--gold);}
      .count-line{
        margin:10px 2px 0;font-size:13.5px;color:var(--ink-3);letter-spacing:.04em;
      }
      .count-line b{font-family:var(--serif);color:var(--navy);font-size:15px;}

      /* ---------- Cards ---------- */
      main{max-width:680px;margin:0 auto;padding:18px 14px 40px;}
      .card{
        background:var(--card);
        border:1px solid var(--line);
        border-radius:8px;
        overflow:hidden;
        margin-bottom:20px;
        box-shadow:0 2px 10px rgba(8,31,92,.06);
      }
      .card figure{margin:0;background:#EDEEF1;}
      .card figure img{
        width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;
      }
      .card-body{padding:18px 18px 20px;}
      .meta-row{
        display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;
      }
      .seq{
        font-family:var(--serif);font-size:13px;font-weight:700;color:var(--ink-3);
        letter-spacing:.1em;
      }
      .platform{
        font-size:12.5px;font-weight:700;letter-spacing:.1em;
        color:var(--navy);border:1px solid var(--navy);
        padding:2px 9px;border-radius:999px;
      }
      .verdict{
        margin-left:auto;font-size:12.5px;font-weight:700;letter-spacing:.08em;
        padding:3px 10px;border-radius:999px;
      }
      .verdict.follow{background:var(--gold);color:var(--navy-deep);}
      .verdict.watch{background:#EFF0F3;color:var(--ink-2);border:1px solid #D8DAE0;}
      .verdict.avoid{background:#F6E9E7;color:#8A3B32;border:1px solid #E3C4BE;}
      .card h2{
        font-family:var(--serif);font-weight:700;
        font-size:20px;line-height:1.45;margin:0 0 10px;color:var(--ink);
      }
      .price{
        font-family:var(--serif);font-weight:700;
        font-size:19px;line-height:1.5;color:var(--navy);
        margin:0 0 14px;
      }
      .price .from{font-size:14px;color:var(--ink-3);font-family:var(--sans);font-weight:400;}
      .fields{border-top:1px solid var(--line);}
      .field{padding:10px 0;border-bottom:1px solid var(--line);}
      .field:last-child{border-bottom:none;}
      .field dt{
        font-size:12.5px;font-weight:700;letter-spacing:.18em;color:var(--gold);
        margin:0 0 3px;
      }
      .field dd{margin:0;font-size:15px;color:var(--ink-2);line-height:1.7;overflow-wrap:anywhere;}
      .field dd.point{color:var(--ink);font-size:15.5px;}
      .view-btn{
        display:flex;align-items:center;justify-content:center;gap:8px;
        margin-top:16px;width:100%;min-height:52px;
        background:var(--gold);color:var(--navy-deep);
        font-size:16.5px;font-weight:700;letter-spacing:.14em;
        text-decoration:none;border-radius:4px;
      }
      .view-btn:active{transform:translateY(1px);}
      .empty{
        text-align:center;color:var(--ink-3);padding:36px 0;font-size:15px;display:none;
      }

      footer{
        max-width:680px;margin:0 auto;padding:0 20px 44px;
        text-align:center;color:var(--ink-3);font-size:13px;line-height:1.9;
      }
      footer .rule{width:56px;height:1px;background:var(--gold);margin:0 auto 14px;}
      footer .fname{font-family:var(--serif);color:var(--navy);font-weight:700;letter-spacing:.1em;}
      footer .wechat{margin:16px auto 0;}
      footer .wechat img{
        width:118px;height:auto;margin:0 auto;
        border:1px solid var(--line);border-radius:6px;background:#fff;padding:5px;
      }
      footer .wechat figcaption{margin-top:7px;font-size:12.5px;color:var(--ink-3);letter-spacing:.06em;}

      @media (min-width:760px){
        h1{font-size:36px;}
        .masthead{padding:44px 24px 34px;}
        main{padding-top:26px;}
        .card h2{font-size:22px;}
      }
    </style>
  </head>
  <body>

    <header class="masthead">
      <div class="masthead-inner">
        <div class="brand-row">凯哥社媒工作室</div>
        <h1>每日全球爆款</h1>
        <p class="date" id="mastDate"></p>
        <div class="stats">
          <div class="stat"><b id="statTotal"></b><span>款产品</span></div>
          <div class="stat"><b id="statSources"></b><span>个来源</span></div>
          <div class="stat gold"><b id="statFollow"></b><span>值得跟进</span></div>
          <div class="stat"><b id="statWatch"></b><span>可以观望</span></div>
          <div class="stat"><b id="statAvoid"></b><span>先别碰</span></div>
        </div>
        <a class="download-btn" id="downloadBtn" href="#" download="">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m6.5 10.5 5.5 5.5 5.5-5.5"/><path d="M4 20h16"/></svg>
          下载本期 Word
        </a>
      </div>
    </header>

    <div class="filterbar">
      <div class="filterbar-inner">
        <div class="chips" id="chips" role="group" aria-label="按平台筛选"></div>
        <p class="count-line" id="countLine"></p>
      </div>
    </div>

    <main id="list"></main>
    <p class="empty" id="empty">该平台本期暂无产品。</p>

    <footer>
      <div class="rule"></div>
      <div class="fname">凯哥社媒工作室 · 每日全球爆款</div>
      <div><span id="footLine"></span><br />页面未显示的数据如实标注，不估算、不补数。</div>
      <figure class="wechat">
        <img src="assets/wechat-qr.jpg" alt="凯歌社媒工作室微信二维码" loading="lazy" />
        <figcaption>微信扫码联系 · 凯歌社媒工作室</figcaption>
      </figure>
    </footer>

    <!-- 数据层：15 款产品数据在 assets/data.js，由爬虫写入，本页只负责渲染 -->
    <script src="assets/data.js"></script>
    <script>
      // 顶栏、统计、下载、页脚全部从数据层（assets/data.js）读取，每天只换数据文件即可
      (function(){
        document.title = "凯哥社媒工作室每日全球爆款 · " + DATA_DATE;
        var parts = DATA_DATE.split("-");
        var cnDate = parts[0] + " 年 " + parseInt(parts[1], 10) + " 月 " + parseInt(parts[2], 10) + " 日";
        document.getElementById("mastDate").textContent = cnDate + " · " + EDITION;
        var platforms = {};
        var follow = 0, watch = 0, avoid = 0;
        for (var i = 0; i < PRODUCTS.length; i++) {
          platforms[PRODUCTS[i].platform] = true;
          if (PRODUCTS[i].vcls === "follow") follow++;
          else if (PRODUCTS[i].vcls === "watch") watch++;
          else if (PRODUCTS[i].vcls === "avoid") avoid++;
        }
        document.getElementById("statTotal").textContent = PRODUCTS.length;
        document.getElementById("statSources").textContent = Object.keys(platforms).length;
        document.getElementById("statFollow").textContent = follow;
        document.getElementById("statWatch").textContent = watch;
        document.getElementById("statAvoid").textContent = avoid;
        var dl = document.getElementById("downloadBtn");
        dl.href = "assets/baokuan-" + DATA_DATE + ".docx";
        dl.setAttribute("download", "凯哥社媒工作室每日全球爆款-" + DATA_DATE + ".docx");
        document.getElementById("footLine").textContent = DATA_DATE + " " + EDITION + " · 数据采集日期 " + DATA_DATE;
      })();

      var FILTERS = [
        { key:"全部", label:"全部" },
        { key:"Facebook", label:"Facebook" },
        { key:"TikTok", label:"TikTok" },
        { key:"Instagram", label:"Instagram" },
        { key:"Reddit", label:"Reddit" },
        { key:"X", label:"X" },
        { key:"Amazon", label:"Amazon" },
        { key:"阿里国际站", label:"阿里国际站" }
      ];

      var listEl = document.getElementById("list");
      var chipsEl = document.getElementById("chips");
      var countEl = document.getElementById("countLine");
      var emptyEl = document.getElementById("empty");
      var current = "全部";

      function countFor(key){
        if(key === "全部") return PRODUCTS.length;
        var c = 0;
        for(var i = 0; i < PRODUCTS.length; i++){ if(PRODUCTS[i].platform === key) c++; }
        return c;
      }

      function esc(s){
        return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
      }

      function renderChips(){
        chipsEl.innerHTML = "";
        FILTERS.forEach(function(f){
          var b = document.createElement("button");
          b.type = "button";
          b.className = "chip" + (f.key === current ? " active" : "");
          b.setAttribute("aria-pressed", f.key === current ? "true" : "false");
          b.innerHTML = esc(f.label) + '<span class="n">' + countFor(f.key) + "</span>";
          b.addEventListener("click", function(){
            current = f.key;
            renderChips();
            renderList();
          });
          chipsEl.appendChild(b);
        });
      }

      function cardHTML(p){
        var priceHTML = esc(p.price) + (p.priceNote ? ' <span class="from">' + esc(p.priceNote) + "</span>" : "");
        return '<article class="card">' +
          '<figure><img src="' + p.img + '" alt="' + esc(p.name) + '" loading="lazy" /></figure>' +
          '<div class="card-body">' +
            '<div class="meta-row">' +
              '<span class="seq">NO.' + (p.n < 10 ? "0" + p.n : p.n) + '</span>' +
              '<span class="platform">' + esc(p.platform) + '</span>' +
              '<span class="verdict ' + p.vcls + '">' + esc(p.verdict) + '</span>' +
            '</div>' +
            '<h2>' + esc(p.name) + '</h2>' +
            '<p class="price">' + priceHTML + '</p>' +
            '<dl class="fields">' +
              '<div class="field"><dt>销售数据</dt><dd>' + esc(p.sales) + '</dd></div>' +
              '<div class="field"><dt>时间</dt><dd>' + esc(p.time) + '</dd></div>' +
              '<div class="field"><dt>卖点</dt><dd class="point">' + esc(p.point) + '</dd></div>' +
            '</dl>' +
            '<a class="view-btn" href="' + p.url + '" target="_blank" rel="noopener noreferrer">查看原品</a>' +
          '</div>' +
        '</article>';
      }

      function renderList(){
        var shown = PRODUCTS.filter(function(p){
          return current === "全部" || p.platform === current;
        });
        listEl.innerHTML = shown.map(cardHTML).join("");
        emptyEl.style.display = shown.length ? "none" : "block";
        countEl.innerHTML = current === "全部"
          ? "当前显示 <b>" + shown.length + "</b> 款 · 全部平台"
          : "当前显示 <b>" + shown.length + "</b> 款 · " + esc(current);
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      renderChips();
      renderList();
    </script>
  </body>
</html>
